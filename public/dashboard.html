<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TokenForge</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">TokenForge</a>
            <div class="nav-links">
                <span id="user-email"></span>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </div>
    </nav>

    <div class="dashboard">
        <div class="dashboard-header">
            <div class="container">
                <div class="balance-card">
                    <h2>Your Balance</h2>
                    <div class="balance-amount" id="balance">0.00 TFC</div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="dashboard-grid">
                <aside class="sidebar">
                    <ul class="sidebar-nav">
                        <li><a href="#" class="active" data-section="overview">Overview</a></li>
                        <li><a href="#" data-section="keys">API Keys</a></li>
                        <li><a href="#" data-section="usage">Usage</a></li>
                        <li><a href="#" data-section="billing">Billing</a></li>
                    </ul>
                </aside>

                <main class="main-content">
                    <section id="overview-section">
                        <h2>Overview</h2>
                        <p>Welcome to your TokenForge dashboard.</p>
                        <button id="buy-tfc-btn" class="btn-primary">Buy TFC Credits</button>
                    </section>

                    <section id="keys-section" style="display:none">
                        <h2>API Keys</h2>
                        <button id="create-key-btn" class="btn-primary">Create New Key</button>
                        <div id="keys-list"></div>
                    </section>

                    <section id="usage-section" style="display:none">
                        <h2>Usage History</h2>
                        <div id="usage-list"></div>
                    </section>

                    <section id="billing-section" style="display:none">
                        <h2>Billing History</h2>
                        <div id="billing-list"></div>
                    </section>
                </main>
            </div>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
