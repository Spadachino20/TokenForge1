<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — TokenForge</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav class="db-nav">
  <a href="/" class="db-brand">⚡ TokenForge</a>
  <div class="db-nav-right">
    <span id="userEmail"></span>
    <a href="#" id="logoutBtn">Log Out</a>
  </div>
</nav>

<div class="db-layout">
  <aside class="db-sidebar">
    <a href="#" class="active" data-section="overview">Overview</a>
    <a href="#" data-section="keys">API Keys</a>
    <a href="#" data-section="projects">Projects</a>
    <a href="#" data-section="billing">Billing</a>
  </aside>

  <main class="db-main">
    <!-- Balance -->
    <div class="balance-card">
      <div>
        <div class="balance-amount" id="balanceTfc">0.00 TFC</div>
        <div class="balance-usd" id="balanceUsd">$0.00 USD</div>
      </div>
      <div class="balance-bar-wrap">
        <div class="balance-bar-label" id="balancePct">—</div>
        <div class="balance-bar">
          <div class="balance-bar-fill" id="balanceBar" style="width:0%"></div>
        </div>
      </div>
      <button class="btn-primary" id="addCreditsBtn">+ Add Credits</button>
    </div>

    <!-- OVERVIEW -->
    <div class="db-section active" id="section-overview">
      <div class="section-title">Usage</div>
      <div class="chart-wrap">
        <canvas id="usageChart" height="80"></canvas>
        <div id="chartEmpty" style="display:none;text-align:center;padding:2rem;color:#555">
          No usage data for today.
        </div>
      </div>
    </div>

    <!-- API KEYS -->
    <div class="db-section" id="section-keys">
      <div class="section-title">API Keys</div>
      <div id="keysList">Loading...</div>
    </div>

    <!-- PROJECTS -->
    <div class="db-section" id="section-projects">
      <div class="section-title">Projects</div>
      <div id="projectsList">Loading...</div>
    </div>

    <!-- BILLING -->
    <div class="db-section" id="section-billing">
      <div class="section-title">Billing History</div>
      <div id="billingList">Loading...</div>
    </div>

  </main>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
