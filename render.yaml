services:
  - type: web
    name: tokenforge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: tf-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tf-redis
          property: connectionString

databases:
  - name: tf-db
    plan: free

  - name: tf-redis
    plan: free
